[project]
name = "technova-mcp-server"
version = "0.1.0"
description = "Server MCP pentru TechNova: produse, comenzi, retururi, politici — cu roluri, validare, rate limiting și audit"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
technova-mcp = "technova_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["technova_mcp*"]

[tool.setuptools.package-data]
technova_mcp = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
