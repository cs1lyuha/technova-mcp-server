name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t technova-mcp .
      - name: Imaginea pornește și răspunde pe portul 8765
        run: |
          docker run -d --name mcp -p 8765:8765 technova-mcp
          for i in $(seq 1 20); do nc -z localhost 8765 && exit 0; sleep 1; done
          docker logs mcp; exit 1
